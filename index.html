<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation in HTML</title>
    <style>
        /* Center the box on the screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        /* 1. Style the element you want to animate */
        .animated-box {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            border-radius: 8px;
            
            /* 2. Bind the keyframe animation to this element */
            animation-name: slideAndColor;
            animation-duration: 3s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        /* 3. Define the animation sequence using @keyframes */
        @keyframes slideAndColor {
            0% {
                transform: translateX(-150px) rotate(0deg);
                background-color: #3498db;
            }
            50% {
                border-radius: 50%; /* Morphs into a circle halfway through */
            }
            100% {
                transform: translateX(150px) rotate(360deg);
                background-color: #e74c3c;
            }
        }
    </style>
</head>
<body>

    <!-- The HTML element to be animated -->
    <div class="animated-box"></div>

</body>
</html>
